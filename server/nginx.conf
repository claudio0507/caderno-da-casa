# Bloco nginx para quando a VPS já tem nginx nas portas 80/443 (em vez do Caddy).
# Copie para /etc/nginx/sites-available/caderno, troque o domínio, ative com
# ln -s ../sites-available/caderno /etc/nginx/sites-enabled/ e rode
# certbot --nginx -d SEU.DOMINIO --redirect para o HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name casa.exemplo.com.br;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 4m;
    }
}
